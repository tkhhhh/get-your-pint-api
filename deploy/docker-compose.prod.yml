# Production compose file. Shipped to the server by the deploy workflow.
# Uses the image published to GHCR by the build-and-push job; every value
# comes from the .env file the workflow writes alongside this file.
#
# Ports are chosen to not collide with the checkout stack, which binds
# host ports 80 and 443 for its proxy on the same server.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${API_HOST_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

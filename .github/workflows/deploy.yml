name: deploy
#
# Builds the api image, pushes it to GHCR, and deploys via SSH to a server
# that already has docker + docker compose installed.
#
# Required secrets (Settings -> Environments -> production -> secrets):
#   DEPLOY_SSH_HOST      hostname or IP of the server
#   DEPLOY_SSH_USER      user with docker access (member of the docker group)
#   DEPLOY_SSH_KEY       private key (whole file) authorised on the server
#   DEPLOY_PATH          directory on the server, e.g. /opt/go-api-server
#   POSTGRES_PASSWORD    Postgres password for the blogs DB
#
# Optional secrets:
#   DEPLOY_SSH_PORT      SSH port (default 22)
#   API_HOST_PORT        public port the api binds on the host (default 8090,
#                        chosen to not collide with the checkout proxy on 80/443)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    name: build api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate .env
        env:
          REGISTRY:          ${{ env.REGISTRY }}
          IMAGE_NAMESPACE:   ${{ env.IMAGE_NAMESPACE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          API_HOST_PORT:     ${{ secrets.API_HOST_PORT }}
        run: |
          umask 077
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          cat > .env.deploy <<EOF
          REGISTRY=$REGISTRY
          IMAGE_NAMESPACE=$IMAGE_NAMESPACE
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_DB=blogs
          POSTGRES_USER=blogs
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
          API_HOST_PORT=${API_HOST_PORT:-8090}
          EOF

      - name: Copy files to server
        env:
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEST:     ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22}"
          SCP="scp -i $HOME/.ssh/id_deploy -P ${SSH_PORT:-22}"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEST'"
          $SCP deploy/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEST/docker-compose.yml"
          $SCP deploy/remote-deploy.sh       "$SSH_USER@$SSH_HOST:$DEST/remote-deploy.sh"
          $SCP .env.deploy                   "$SSH_USER@$SSH_HOST:$DEST/.env"

      - name: Deploy
        env:
          SSH_USER:   ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST:   ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT:   ${{ secrets.DEPLOY_SSH_PORT }}
          DEST:       ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:  ${{ github.actor }}
        run: |
          # Token is piped over stdin so it never appears in `ps` on the server.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_deploy" -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEST' && chmod 600 .env && GHCR_USER='$GHCR_USER' bash remote-deploy.sh"

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`sha-${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "Host: \`${{ secrets.DEPLOY_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
